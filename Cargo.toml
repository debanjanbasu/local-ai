[workspace]
resolver = "3"
members = [
    "local-metal",
    "local-engine",
    "local-ai",
]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/debanjanbasu/local-ai"
publish = false

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
string_slice = "deny"
volatile_composites = "allow"
future_not_send = "allow"
large_futures = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
missing_errors_doc = "allow"
module_name_repetitions = "allow"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
half = { version = "2.7", features = ["use-intrinsics", "zerocopy", "bytemuck"] }
bytemuck = { version = "1.25", features = ["aarch64_simd", "derive", "latest_stable_rust"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
sha2 = "0.11"
