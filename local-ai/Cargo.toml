[package]
name = "local-ai"
version = "0.2.0"
description = "Bonsai 2 27B command-line interface and HTTP server"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
local-engine = { path = "../local-engine" }
local-services = { path = "../local-services" }
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "tokio", "multipart"] }
base64 = "0.23.1"
half.workspace = true
bytes.workspace = true
http-body = "1"
http-body-util.workspace = true
h3.workspace = true
h3-quinn.workspace = true
# Already in the lock through axum; used directly to serve connections with a
# timer, so hyper's HTTP/1 header-read timeout applies (see serve/connection.rs).
hyper = { workspace = true, features = ["server", "http1", "http2"] }
hyper-util = { workspace = true, features = ["server-auto", "service", "tokio"] }
tower-service = "0.3"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "fs", "io-util", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io", "io-util"] }
tempfile.workspace = true
quinn.workspace = true
rustls = { workspace = true, features = ["ring", "std"] }
# Both already in the lock (ring via rustls/quinn, rustix via tempfile); used
# directly by the opt-in reasoning envelope cipher (AES-256-GCM, OS randomness)
# and its owner-only, symlink-refusing key file.
ring.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
zstd.workspace = true

[dev-dependencies]
# Checks the Evals API objects against the pinned OpenAI schemas; the
# engine's version, offline.
jsonschema.workspace = true
