[package]
name = "local-ai"
version = "0.2.0"
description = "Bonsai 2 27B command-line interface and HTTP server"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
local-engine = { path = "../local-engine" }
local-services = { path = "../local-services" }
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "tokio", "multipart"] }
base64 = "0.22"
bytes = "1"
http-body-util = "0.1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "fs", "io-util"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io", "io-util"] }
tempfile = "3"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Both already in the lock (ring via rustls/quinn, rustix via tempfile); used
# directly by the opt-in reasoning envelope cipher (AES-256-GCM, OS randomness)
# and its owner-only, symlink-refusing key file.
ring = "0.17"
rustix = { version = "1", features = ["fs", "process"] }
rustls-pemfile = "2"
zstd = { version = "0.13", default-features = false }
