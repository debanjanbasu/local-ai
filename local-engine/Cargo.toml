[package]
name = "local-engine"
version = "0.2.0"
description = "Bonsai 2 27B inference engine library for Apple Silicon"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
local-metal = { path = "../local-metal" }
bytemuck.workspace = true
futures-core = "0.3"
half.workspace = true
# Image decoding for the optional EmbeddingGemma 2 vision encoder. No default
# features: no rayon pool, only the formats the embedding API accepts.
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
# JPEG decoding with libjpeg-turbo's decoder (built from source, NEON SIMD, no
# nasm): bit-identical to the reference's Pillow/torchvision decode, which
# zune-jpeg is not. Errors unwind (caught) instead of aborting.
mozjpeg = { version = "0.10", default-features = false, features = ["with_simd"] }
mozjpeg-sys = { version = "2", default-features = false, features = ["with_simd", "unwinding", "arith_dec"] }
# Tool argument schemas. No default features: no HTTP or file `$ref`
# retrieval (and no `idna`), so validation never leaves the process.
jsonschema = { version = "0.58.6", default-features = false }
# Schema-constrained decoding. No default features: no `referencing`
# (remote/file `$ref` retrieval), no rayon thread pool. The Lark front end
# builds the native tool-call grammar.
llguidance = { version = "=1.9.1", default-features = false, features = ["lark"] }
memmap2 = "0.9"
objc2 = "0.6"
objc2-metal = { version = "0.3", features = ["MTLBuffer", "MTLDevice"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
tokenizers.workspace = true
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
tempfile = "3"
