[package]
name = "local-engine"
version = "0.2.0"
description = "Bonsai 2 27B inference engine library for Apple Silicon"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
local-metal = { path = "../local-metal" }
bytemuck.workspace = true
futures-core = "0.3"
half.workspace = true
memmap2 = "0.9"
objc2 = "0.6"
objc2-metal = { version = "0.3", features = ["MTLBuffer", "MTLDevice"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
tokenizers.workspace = true
tokio = { version = "1", features = ["rt", "sync"] }
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
tempfile = "3"
