[package]
name = "local-engine"
version = "0.2.0"
description = "Bonsai 2 27B inference engine library for Apple Silicon"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
local-metal = { path = "../local-metal" }
bytemuck.workspace = true
futures-core = "0.3"
half.workspace = true
# Image decoding for the optional EmbeddingGemma 2 vision encoder. No default
# features: no rayon pool, only the formats the embedding API accepts.
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
# JPEG decoding with libjpeg-turbo's decoder (built from source, NEON SIMD, no
# nasm): bit-identical to the reference's Pillow/torchvision decode, which
# zune-jpeg is not. Errors unwind (caught) instead of aborting.
mozjpeg = { version = "0.10", default-features = false, features = ["with_simd"] }
mozjpeg-sys = { version = "2", default-features = false, features = ["with_simd", "unwinding", "arith_dec"] }
# Tool argument schemas. No default features: no HTTP or file `$ref`
# retrieval (and no `idna`), so validation never leaves the process.
jsonschema = { version = "0.58.6", default-features = false }
# Schema-constrained decoding. No default features: no `referencing`
# (remote/file `$ref` retrieval), no rayon thread pool. The Lark front end
# builds the native tool-call grammar.
llguidance = { version = "=1.9.1", default-features = false, features = ["lark"] }
# Speech output encoders (pure Rust, permissive; see docs/SPEECH.md).
flacenc = { version = "0.5.1", default-features = false }
memmap2 = "0.9"
ogg = "0.9.2"
rusty_mp3 = "1.0.0"
rusty-opus = "1.0.1"
objc2 = "0.6"
# Audio embeddings: STFT of the log-mel features and resampling to 16 kHz.
realfft = "3.5"
rubato = { version = "5", default-features = false, features = ["fft_resampler"] }
objc2-metal = { version = "0.3", features = ["MTLBuffer", "MTLDevice"] }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
sha2.workspace = true
tokenizers.workspace = true
tokio = { version = "1", features = ["rt", "sync"] }
# Audio input (`transcription::audio`, `embedding::decode_audio`): pure-Rust
# demuxers and decoders for the formats the OpenAI audio endpoints accept (no
# Opus decoder exists).
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "mp3", "pcm", "wav", "isomp4", "aac", "alac", "ogg", "vorbis", "mkv"] }
# The log-mel front end's 400-point FFT.
rustfft = "6.4"
# zlib itself (not a re-implementation) for Whisper's compression-ratio test.
flate2 = { version = "1", default-features = false, features = ["zlib"] }
# Video input (`bonsai_vision::video`): AVFoundation's demuxers and
# VideoToolbox's decoders, the system's own (no bundled codec library).
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVAsset", "AVAssetReader", "AVAssetReaderOutput", "AVAssetTrack", "AVMediaFormat", "objc2-core-foundation", "objc2-core-media"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "CMBase", "CMFormatDescription", "CMSampleBuffer", "CMTime", "objc2-core-video"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDictionary", "NSError", "NSString", "NSURL", "NSValue", "NSArray"] }
# The video file AVFoundation opens, deleted when dropped.
tempfile = "3"
