[package]
name = "local-metal"
version = "0.2.0"
description = "Metal kernels and runtime for Bonsai 2 27B inference on Apple Silicon"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
half.workspace = true
bytemuck.workspace = true
thiserror.workspace = true
block2 = "0.6.2"
# `exception`: the private Neural Engine client (`ane`) turns Objective-C
# exceptions into errors instead of unwinding through Rust.
objc2 = { version = "0.6.5", features = ["exception"] }
objc2-metal = { version = "0.3", features = ["MTLDevice", "MTLCommandQueue", "MTLCommandBuffer", "MTLBuffer", "MTLAllocation", "MTLResource", "MTLLibrary", "MTLComputePipeline", "MTLComputeCommandEncoder", "MTLBlitCommandEncoder", "MTLCommandEncoder", "MTLTypes", "MTLEvent", "block2"] }
objc2-foundation = "0.3"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFDictionary", "CFString"] }
objc2-io-surface = { version = "0.3.2", default-features = false, features = ["std", "IOSurfaceRef", "objc2", "objc2-core-foundation"] }
dispatch2 = "0.3"
